name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — lint, type-check, unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type-check with mypy
        run: |
          pip install mypy
          mypy app --ignore-missing-imports --no-strict-optional

      - name: Run unit tests
        run: pytest -v --tb=short
        env:
          # Unit tests use the mock DB — no real Postgres needed.
          # These env vars keep pydantic-settings happy.
          ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/healthdash
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/healthdash
          APP_ENV: test
          SECRET_KEY: ci-secret-key

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — lint, type-check, unit tests, build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker — ensure the production images build successfully
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only run if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: healthdash-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: healthdash-frontend:ci
          target: production
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E — run Playwright against the full Docker Compose stack
  # Only runs on push to main/master to keep PR feedback fast.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Docker Compose stack
        run: |
          docker compose up -d --build
          # Wait until the frontend is reachable (up to 90s)
          timeout 90 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
